version: "2"
run:
  tests: true
linters:
  enable:
    - depguard
    - gosec
    - misspell
    - revive
  settings:
    depguard:
      rules:
        adapter-cache-boundary:
          files:
            - internal/adapter/cache/**
          deny:
            - pkg: doki-backend/internal/adapter/http
              desc: Cache adapters must not import HTTP layer
            - pkg: github.com/jackc/pgx
              desc: Cache adapters must not import database drivers
        adapter-repository-boundary:
          files:
            - internal/adapter/repository/**
          deny:
            - pkg: doki-backend/internal/adapter/http
              desc: Repository adapters must not import HTTP layer
            - pkg: github.com/go-chi/chi
              desc: Repository adapters must not import HTTP routing
        domain-pure-boundary:
          files:
            - internal/domain/**
          deny:
            - pkg: github.com/jackc/pgx
              desc: Domain layer must not import PostgreSQL driver
            - pkg: github.com/redis/go-redis
              desc: Domain layer must not import Redis cache client
            - pkg: github.com/go-chi/chi
              desc: Domain layer must not import HTTP router framework
            - pkg: net/http
              desc: Domain layer must not import HTTP transport package
            - pkg: doki-backend/internal/adapter
              desc: Domain layer must not import adapter implementations
            - pkg: doki-backend/internal/platform
              desc: Domain layer must not import platform infrastructure
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - test
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
